# fly.toml app configuration file generated for bhusrigeo on 2026-09-26T12:49:31Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'bhusrigeo'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  ADMIN_EMAIL = 'info@bhusrigeo.com'
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
