# Fly.io configuration for BHUSRI GEOSCIENCES & ENGINEERING SOLUTIONS PRIVATE LIMITED
app = "bhusrigeo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  ADMIN_EMAIL = "info@bhusrigeo.com"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
